<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%" fill="none">
  <!-- Outer Cable Loop -->
  <path d="M 45,60 C 35,20 100,5 115,28" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- 2-Pin Plug on Left -->
  <g transform="translate(38, 55) rotate(-35)">
    <rect x="-8" y="-12" width="16" height="15" rx="3" fill="#38bdf8"/>
    <line x1="-4" y1="-12" x2="-4" y2="-19" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="4" y1="-12" x2="4" y2="-19" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Cable to right lamp -->
  <path d="M 105,25 C 135,10 160,25 158,60" stroke="#f5b301" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Hanging Lamp -->
  <g transform="translate(158, 62)">
    <circle cx="0" cy="0" r="3" fill="#f5b301"/>
    <path d="M -10,10 C -9,4 9,4 10,10 Z" fill="#f5b301"/>
    <circle cx="0" cy="11" r="2.5" fill="#fef08a"/>
    <circle cx="0" cy="11" r="6" fill="#fef08a" opacity="0.4"/>
  </g>

  <!-- Left Navy/Cyan Leg of M -->
  <path d="M 50,92 L 68,92 L 68,36 L 50,36 Z" fill="#ffffff"/>
  <path d="M 68,36 L 90,75 L 90,52 L 78,36 Z" fill="#ffffff"/>

  <!-- Right Golden Leg of M with Lightning Bolt Cut -->
  <path d="M 90,48 L 115,28 L 115,92 L 98,92 L 98,58 Z" fill="#f5b301"/>
  <!-- Central Lightning Bolt -->
  <polygon points="87,30 74,62 88,60 76,92 104,52 90,54" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Brand Typography -->
  <g transform="translate(180, 0)">
    <text x="0" y="52" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="4">MOLLICK</text>
    
    <!-- Decorative Wings around ELECTRIC -->
    <line x1="0" y1="73" x2="35" y2="73" stroke="#f5b301" stroke-width="2.5"/>
    <text x="45" y="79" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="18" fill="#f5b301" letter-spacing="5">ELECTRIC</text>
    <line x1="185" y1="73" x2="220" y2="73" stroke="#f5b301" stroke-width="2.5"/>
    
    <!-- & INTERIOR -->
    <text x="228" y="79" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="18" fill="#ffffff" letter-spacing="4">&amp; INTERIOR</text>
    
    <!-- Subtitle / Tagline -->
    <line x1="0" y1="92" x2="305" y2="92" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="106" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="9.5" fill="#94a3b8" letter-spacing="1.8">POWERING SPACES, DEFINING LIFESTYLES</text>
  </g>
</svg>
